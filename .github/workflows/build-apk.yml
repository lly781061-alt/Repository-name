name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Ensure Android project files
        run: flutter create --platforms=android .

      - name: Update Android Gradle Plugin & Gradle Wrapper
        run: |
          python3 -c '
          import glob, re
          for path in glob.glob("android/settings.gradle*"):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              updated = re.sub(r"(com\.android\.application[\"'\'']?\s*version\s*[\"'\''])[^\"'\'']+", r"\g<1>8.5.0", content)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(updated)
          wrapper = "android/gradle/wrapper/gradle-wrapper.properties"
          with open(wrapper, "r", encoding="utf-8") as f:
              w_content = f.read()
          w_updated = re.sub(r"gradle-[0-9.]+-(all|bin)\.zip", "gradle-8.7-all.zip", w_content)
          with open(wrapper, "w", encoding="utf-8") as f:
              f.write(w_updated)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
