<!-- بداية قسم المزامنة السحابية وتصدير/استيراد ملفات النسخ الاحتياطي لتطبيق السنبلة -->
<div id="sunbula-sync-and-file-panel" dir="rtl" style="margin:14px 0;padding:12px;border:1px solid #d0d7de;border-radius:10px;background:#f8fafc;font-family:inherit;">
  <div style="font-weight:700;margin-bottom:8px;">☁️ مزامنة السنبلة ونقل النسخ الاحتياطية</div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
    <button type="button" id="sunbulaBtnPushSync" onclick="sunbulaSyncAction('push')" style="padding:8px 12px;border-radius:8px;border:0;background:#1d4ed8;color:#fff;cursor:pointer;">
      💾 حفظ المزامنة
    </button>
    <button type="button" id="sunbulaBtnPullSync" onclick="sunbulaSyncAction('pull')" style="padding:8px 12px;border-radius:8px;border:0;background:#0f766e;color:#fff;cursor:pointer;">
      🔄 سحب الآن للهاتف
    </button>
    <button type="button" id="sunbulaBtnExportJson" onclick="sunbulaExportBackupFile()" style="padding:8px 12px;border-radius:8px;border:0;background:#334155;color:#fff;cursor:pointer;">
      📤 تصدير ملف نسخة
    </button>
    <button type="button" id="sunbulaBtnImportJson" onclick="document.getElementById('sunbulaImportFileInput').click()" style="padding:8px 12px;border-radius:8px;border:0;background:#0369a1;color:#fff;cursor:pointer;">
      📥 استيراد ملف نسخة
    </button>
    <input type="file" id="sunbulaImportFileInput" accept=".json,application/json" style="display:none" onchange="sunbulaImportBackupFile(event)" />
  </div>

  <div id="sunbulaSyncStatusText" style="font-size:13px;color:#334155;">
    الحالة: جاهز — يمكنك المزامنة أو التصدير/الاستيراد بملف JSON.
  </div>
</div>

<script>
(function () {
  if (window.__SUNBULA_SYNC_PATCH_LOADED__) return;
  window.__SUNBULA_SYNC_PATCH_LOADED__ = true;

  const URL_KEYS = ['sunbula_cloud_sync_url_v1', 'sunbula_sync_url', 'sync_url'];
  const EMAIL_KEYS = ['sunbula_drive_email_v1', 'sunbula_email', 'drive_email'];
  const STATE_KEY = 'sunbula_app_state_v1';

  // نقل اللوحة تلقائياً إلى قسم الإعدادات إذا وُجد لتبدو جزءاً طبيعياً من الإعدادات
  function mountPanelInSettings() {
    const panel = document.getElementById('sunbula-sync-and-file-panel');
    if (!panel) return;
    const settingsContainer =
      document.querySelector('#settings, [data-page="settings"], [data-tab="settings"], .settings-page, .settings-section');
    if (settingsContainer && !settingsContainer.contains(panel)) {
      settingsContainer.appendChild(panel);
    }
  }

  function setStatus(msg, isError) {
    const el = document.getElementById('sunbulaSyncStatusText');
    if (el) {
      el.textContent = msg;
      el.style.color = isError ? '#b91c1c' : '#0f766e';
    }
  }

  function cleanUrl(raw) {
    return String(raw || '').trim().replace(/^[\[\("'`\s]+|[\]\)"'`\s]+$/g, '');
  }

  function getSyncUrl() {
    const input = document.querySelector('[data-sync-url], #syncUrl, #sync-url, input[placeholder*="/exec"]');
    if (input && input.value && input.value.trim()) {
      const cleaned = cleanUrl(input.value);
      URL_KEYS.forEach((k) => localStorage.setItem(k, cleaned));
      return cleaned;
    }
    for (const k of URL_KEYS) {
      const v = cleanUrl(localStorage.getItem(k));
      if (v) return v;
    }
    return '';
  }

  function getSyncEmail() {
    const input = document.querySelector('[data-sync-email], #driveEmail, #drive-email, input[type="email"]');
    if (input && input.value && input.value.trim()) {
      const email = input.value.trim().toLowerCase();
      EMAIL_KEYS.forEach((k) => localStorage.setItem(k, email));
      return email;
    }
    for (const k of EMAIL_KEYS) {
      const v = (localStorage.getItem(k) || '').trim().toLowerCase();
      if (v) return v;
    }
    return '';
  }

  function collectState() {
    const direct = localStorage.getItem(STATE_KEY);
    if (direct) {
      try {
        return JSON.parse(direct);
      } catch (_) {}
    }
    const bag = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key) continue;
      if (key.startsWith('__') || key.includes('sync_url')) continue;
      bag[key] = localStorage.getItem(key);
    }
    return bag;
  }

  function applyState(stateObj) {
    if (!stateObj || typeof stateObj !== 'object') return false;
    const source =
      stateObj.__fullLocalStorage && typeof stateObj.__fullLocalStorage === 'object'
        ? stateObj.__fullLocalStorage
        : stateObj;

    Object.keys(source).forEach((key) => {
      const val = source[key];
      localStorage.setItem(key, typeof val === 'string' ? val : JSON.stringify(val));
    });
    return true;
  }

  // إرسال البيانات بصيغة text/plain مع no-cors لتفادي حظر preflight من file://
  async function pushToCloud() {
    const url = getSyncUrl();
    const email = getSyncEmail();

    if (!url || !url.includes('/exec')) {
      setStatus('يرجى إدخال رابط المزامنة الصحيح الذي ينتهي بـ /exec أولاً.', true);
      alert('يرجى التأكد من لصق رابط المزامنة الصحيح الذي ينتهي بـ /exec.');
      return false;
    }
    if (!email) {
      setStatus('يرجى إدخال البريد الإلكتروني أولاً قبل حفظ المزامنة.', true);
      alert('يرجى إدخال البريد الإلكتروني الخاص بحسابك أولاً.');
      return false;
    }

    setStatus('جاري إرسال البيانات إلى السحابة...', false);
    const payload = {
      email: email,
      updatedAt: Date.now(),
      state: { __fullLocalStorage: collectState() }
    };

    try {
      await fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      localStorage.setItem('sunbula_last_push_at', new Date().toISOString());
      setStatus('تم إرسال طلب المزامنة السحابية (' + new Date().toLocaleTimeString('ar-IQ') + ').', false);
      return true;
    } catch (err) {
      const msg = err && err.message ? err.message : 'تعذر الاتصال';
      setStatus('تعذر الإرسال المباشر من file://: ' + msg + ' — استخدم تصدير ملف نسخة.', true);
      return false;
    }
  }

  // سحب البيانات عبر GET؛ وإذا منعت صفحة file:// قراءة الاستجابة يوجّه للتصدير/الاستيراد بملف
  async function pullFromCloud() {
    const url = getSyncUrl();
    const email = getSyncEmail();

    if (!url || !url.includes('/exec')) {
      setStatus('رابط المزامنة غير صالح؛ يجب أن ينتهي بـ /exec.', true);
      alert('يرجى إدخال رابط المزامنة الصحيح الذي ينتهي بـ /exec أولاً.');
      return false;
    }
    if (!email) {
      setStatus('البريد الإلكتروني غير محدد للسحب.', true);
      alert('يرجى إدخال البريد الإلكتروني أولاً.');
      return false;
    }

    setStatus('جاري سحب البيانات من السحابة...', false);
    const sep = url.includes('?') ? '&' : '?';
    const endpoint = `${url}${sep}email=${encodeURIComponent(email)}&_t=${Date.now()}`;

    try {
      const res = await fetch(endpoint, { method: 'GET', cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || !data.state) {
        setStatus('الرابط متصل ولكن لا توجد بيانات مخزنة لهذا البريد بعد.', true);
        alert('الرابط متصل ولكن لا توجد بيانات محفوظة لهذا البريد بعد.');
        return false;
      }
      applyState(data.state);
      setStatus('تم سحب البيانات وتحديثها بنجاح.', false);
      alert('تمت مزامنة البيانات بنجاح. سيتم إعادة تحميل التطبيق.');
      location.reload();
      return true;
    } catch (err) {
      const reason = err && err.message ? err.message : 'Network/CORS blocked on file://';
      setStatus('تعذر السحب المباشر من file:// (' + reason + '). استخدم تصدير/استيراد ملف نسخة.', true);
      alert('تعذر السحب من رابط المزامنة حالياً من صفحة file://.\nيمكنك نقل البيانات فوراً عبر "تصدير ملف نسخة" في الهاتف الأول و"استيراد ملف نسخة" في الهاتف الثاني.');
      return false;
    }
  }

  window.sunbulaSyncAction = function (mode) {
    if (mode === 'pull') return pullFromCloud();
    return pushToCloud();
  };

  window.sunbulaExportBackupFile = function () {
    const email = getSyncEmail() || 'sunbula';
    const exportPayload = {
      app: 'Sunbula',
      exportedAt: new Date().toISOString(),
      email: email,
      data: collectState()
    };
    const blob = new Blob([JSON.stringify(exportPayload, null, 2)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `sunbula-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(link.href), 1500);
    setStatus('تم إنشاء ملف النسخة الاحتياطية؛ أرسله إلى الهاتف الثاني ثم استورده.', false);
  };

  window.sunbulaImportBackupFile = function (event) {
    const file = event && event.target && event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      try {
        const parsed = JSON.parse(String(e.target.result || '{}'));
        const payload = parsed && parsed.data ? parsed.data : parsed;
        applyState({ __fullLocalStorage: payload });
        alert('تم استيراد النسخة الاحتياطية بنجاح. سيتم إعادة تحميل التطبيق.');
        location.reload();
      } catch (_) {
        alert('تعذر قراءة الملف؛ تأكد من اختيار ملف نسخة احتياطية JSON صحيح.');
      } finally {
        event.target.value = '';
      }
    };
    reader.readAsText(file);
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mountPanelInSettings);
  } else {
    mountPanelInSettings();
  }
})();
</script>
<!-- نهاية قسم المزامنة السحابية وتصدير/استيراد ملفات النسخ الاحتياطي -->
